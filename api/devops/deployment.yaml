apiVersion: apps/v1
kind: Deployment
metadata:
  name: pos-api-deployment
  namespace: app-dev
  labels:
    app: pos-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pos-api
  template:
    metadata:
      labels:
        app: pos-api
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: pos-api
        image: ghcr.io/mehdibouzidi/pos-manager-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        # The JVM uses heap + ~150-200 MB outside it (metaspace, code cache, threads, GC).
        # Heap 350 MB keeps the whole process under the 600Mi limit (it was OOMKilled with a 400 MB heap and 500Mi).
        - name: JAVA_TOOL_OPTIONS
          value: "-Xms350m -Xmx350m -XX:MaxMetaspaceSize=150m -XX:ReservedCodeCacheSize=48m -Xss512k -XX:+UseSerialGC -XX:CICompilerCount=2 -XX:+ExitOnOutOfMemoryError"
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            secretKeyRef:
              name: pos-postgres-secret
              key: datasource-url
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: pos-postgres-secret
              key: datasource-username
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pos-postgres-secret
              key: datasource-password
        - name: APP_JWTSECRET
          valueFrom:
            secretKeyRef:
              name: pos-api-secret
              key: JWT_SECRET
        - name: APP_COOKIESECURE
          valueFrom:
            secretKeyRef:
              name: pos-api-secret
              key: COOKIE_SECURE
        - name: APP_COOKIESAMESITE
          valueFrom:
            secretKeyRef:
              name: pos-api-secret
              key: COOKIE_SAME_SITE
        resources:
          limits:
            cpu: 200m
            memory: 600Mi
          requests:
            cpu: 100m
            memory: 600Mi
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Not enough resources on the node for a second pod: stop the old one first, then start the new one
      # (brief unavailability during the rollout, same as catering-manager).
      maxUnavailable: 1
      maxSurge: 0
