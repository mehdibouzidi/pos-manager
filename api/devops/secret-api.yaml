apiVersion: v1
kind: Secret
metadata:
  name: pos-api-secret
  namespace: pos-prod
type: Opaque
stringData:
  JWT_SECRET: REPLACE_WITH_JWT_SECRET
  # true en production (cookie httpOnly envoyé sur HTTPS uniquement)
  COOKIE_SECURE: "true"
  # None est requis si ui et api sont sur des sous-domaines différents
  COOKIE_SAME_SITE: "Lax"
