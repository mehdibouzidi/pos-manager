name: Deploy UI Admin

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CI_CD }}

      - name: Compute versions
        id: version
        run: |
          FULL_VERSION=$(node -p "require('./ui-admin/package.json').version")
          RELEASE_VERSION=${FULL_VERSION%-SNAPSHOT}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$RELEASE_VERSION"
          NEXT_VERSION="$MAJOR.$MINOR.$((PATCH + 1))-SNAPSHOT"
          echo "release_version=$RELEASE_VERSION" >> $GITHUB_OUTPUT
          echo "next_version=$NEXT_VERSION" >> $GITHUB_OUTPUT

      - name: Set release version in package.json
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('ui-admin/package.json'));
            pkg.version = '${{ steps.version.outputs.release_version }}';
            fs.writeFileSync('ui-admin/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CI_CD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./ui-admin
          file: ./ui-admin/devops/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pos-manager-admin:${{ steps.version.outputs.release_version }}
          build-args: APP_VERSION=${{ steps.version.outputs.release_version }}

      - name: Deploy to Kubernetes
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_DATA" | base64 -d > ~/.kube/config
          kubectl set image deployment/pos-admin-deployment pos-admin=ghcr.io/${{ github.repository_owner }}/pos-manager-admin:${{ steps.version.outputs.release_version }} -n app-dev
          kubectl rollout status deployment/pos-admin-deployment -n app-dev

      - name: Increment to next SNAPSHOT in package.json
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('ui-admin/package.json'));
            pkg.version = '${{ steps.version.outputs.next_version }}';
            fs.writeFileSync('ui-admin/package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ui-admin/package.json
          git commit -m "release(ui-admin): ${{ steps.version.outputs.release_version }} → ${{ steps.version.outputs.next_version }}"
          git tag v${{ steps.version.outputs.release_version }}-ui-admin
          git pull --rebase
          git push
          git push --tags
