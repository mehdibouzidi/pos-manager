<vex-page-layout>
  <vex-page-layout-header class="pb-16 flex flex-col items-start justify-center">
    <div class="w-full flex flex-col sm:flex-row justify-between container">
      <div>
        <h1 class="title mt-0 mb-1">Journaux de Sessions</h1>
        <vex-breadcrumbs [crumbs]="['Administration', 'Journaux de Sessions']"></vex-breadcrumbs>
      </div>
    </div>
  </vex-page-layout-header>

  <vex-page-layout-content class="-mt-6 container">
    <div class="card overflow-auto -mt-16">
      <div class="bg-app-bar px-6 h-16 border-b sticky left-0 flex items-center">
        <h2 class="title my-0 ltr:pr-4 rtl:pl-4 ltr:mr-4 rtl:ml-4 ltr:border-r rtl:border-l hidden sm:block flex-none">
          <span>Journaux</span>
        </h2>
        <div class="bg-foreground rounded-full border px-4 max-w-[300px] flex-auto flex items-center border border-divider">
          <mat-icon class="icon-sm text-secondary" svgIcon="mat:search"></mat-icon>
          <input [(ngModel)]="criteria.ipAddress" (ngModelChange)="search()"
            class="px-4 py-2 border-0 outline-none w-full bg-transparent"
            placeholder="Filtrer par adresse IP..." type="search" />
        </div>
        <span class="flex-1"></span>
        <button [matMenuTriggerFor]="columnFilterMenu" class="ml-4 flex-none" mat-icon-button matTooltip="Colonnes" type="button">
          <mat-icon svgIcon="mat:filter_list"></mat-icon>
        </button>
      </div>

      <mat-progress-bar *ngIf="isLoading" mode="indeterminate" color="primary"></mat-progress-bar>

      <table @stagger [dataSource]="dataSource" class="w-full" mat-table matSort (matSortChange)="announceSortChange($event)">

        <ng-container matColumnDef="userFullName">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Utilisateur</th>
          <td mat-cell *matCellDef="let row">
            <span class="font-medium">{{ row.userFullName }}</span>
            <div class="text-xs text-secondary">{{ row.userUsername }}</div>
          </td>
        </ng-container>

        <ng-container matColumnDef="posName">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Terminal POS</th>
          <td mat-cell *matCellDef="let row">{{ row.posName }}</td>
        </ng-container>

        <ng-container matColumnDef="ipAddress">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Adresse IP</th>
          <td mat-cell *matCellDef="let row">
            <code class="text-xs bg-gray-100 px-1 rounded">{{ row.ipAddress }}</code>
          </td>
        </ng-container>

        <ng-container matColumnDef="loginAt">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Date de connexion</th>
          <td mat-cell *matCellDef="let row">{{ row.loginAt | date:'dd/MM/yyyy HH:mm' }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let row">
            <div class="flex items-center gap-1 justify-end">
              <button mat-icon-button matTooltip="Voir" (click)="goToShow(row)" type="button">
                <mat-icon svgIcon="mat:remove_red_eye" class="icon-sm text-primary"></mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="visibleColumns"></tr>
        <tr mat-row @fadeInUp *matRowDef="let row; columns: visibleColumns;"></tr>
      </table>

      <mat-paginator [pageSizeOptions]="pageSizeOptions" [pageSize]="pageSize"
        [length]="globalPayload.totalNumberOfElements"
        (page)="onPaginationChange($event)" showFirstLastButtons>
      </mat-paginator>
    </div>
  </vex-page-layout-content>
</vex-page-layout>

<mat-menu #columnFilterMenu="matMenu" xPosition="before" yPosition="below">
  <button (click)="toggleColumnVisibility(column, $event)" *ngFor="let column of columns; trackBy: trackByProperty"
    class="checkbox-item mat-menu-item">
    <mat-icon *ngIf="column.visible" svgIcon="mat:check_box"></mat-icon>
    <mat-icon *ngIf="!column.visible" svgIcon="mat:check_box_outline_blank"></mat-icon>
    <span>{{ column.label }}</span>
  </button>
</mat-menu>
