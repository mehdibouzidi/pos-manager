<vex-page-layout>
    <vex-page-layout-header class="pb-16 flex flex-col items-start justify-center">
        <div class="w-full flex flex-col sm:flex-row justify-between px-6">
            <div>
                <h1 class="title mt-0 mb-1">Magasins</h1>
                <vex-breadcrumbs [crumbs]="['Administration', 'Magasins']"></vex-breadcrumbs>
            </div>
        </div>
    </vex-page-layout-header>

    <vex-page-layout-content class="-mt-6 px-6">
        <div class="card overflow-auto -mt-16">
            <!--  TABLE HEADER Filters -->
            <div class="bg-app-bar px-6 h-18 border-b sticky left-0 flex items-center table-filter">
                <mat-form-field class="input">
                    <mat-label>Code</mat-label>
                    <input matInput placeholder="Ex. STORE001" name="f.code" [(ngModel)]="criteria.code" (keydown.enter)="search()">
                </mat-form-field>

                <mat-form-field class="input">
                    <mat-label>Nom</mat-label>
                    <input matInput placeholder="Ex. Magasin Central" name="f.name" [(ngModel)]="criteria.name" (keydown.enter)="search()">
                </mat-form-field>
            </div>

            <!--  TABLE HEADER Actions -->
            <div class="bg-app-bar px-6 h-16 border-b sticky left-0 flex items-center">
                <span class="flex-1"></span>

                <button (click)="search()" class="ml-4 flex-none" color="primary" mat-mini-fab
                    matTooltip="Rechercher" type="button">
                    <mat-icon svgIcon="mat:search"></mat-icon>
                </button>

                <button *ngIf="canCreate()" (click)="goToAdd()" class="ml-4 flex-none" color="primary" mat-mini-fab matTooltip="Ajouter"
                    type="button">
                    <mat-icon svgIcon="mat:add"></mat-icon>
                </button>
            </div>

            <!-- Progress Bar -->
            <mat-progress-bar *ngIf="isLoading" mode="indeterminate"></mat-progress-bar>

            <table [dataSource]="dataSource" class="w-full" mat-table matSort>
                <!-- Code Column -->
                <ng-container matColumnDef="code">
                    <th *matHeaderCellDef class="uppercase" mat-header-cell mat-sort-header>Code</th>
                    <td *matCellDef="let row" mat-cell>{{ row.code }}</td>
                </ng-container>

                <!-- Name Column -->
                <ng-container matColumnDef="name">
                    <th *matHeaderCellDef class="uppercase" mat-header-cell mat-sort-header>Nom</th>
                    <td *matCellDef="let row" mat-cell>{{ row.name }}</td>
                </ng-container>

                <!-- Address Column -->
                <ng-container matColumnDef="address">
                    <th *matHeaderCellDef class="uppercase" mat-header-cell mat-sort-header>Adresse</th>
                    <td *matCellDef="let row" mat-cell>{{ row.address }}</td>
                </ng-container>

                <!-- Phone Column -->
                <ng-container matColumnDef="phone">
                    <th *matHeaderCellDef class="uppercase" mat-header-cell mat-sort-header>Téléphone</th>
                    <td *matCellDef="let row" mat-cell>{{ row.phone }}</td>
                </ng-container>

                <!-- Email Column -->
                <ng-container matColumnDef="email">
                    <th *matHeaderCellDef class="uppercase" mat-header-cell mat-sort-header>Email</th>
                    <td *matCellDef="let row" mat-cell>{{ row.email }}</td>
                </ng-container>

                <!-- Active Column -->
                <ng-container matColumnDef="active">
                    <th *matHeaderCellDef class="uppercase" mat-header-cell mat-sort-header>Actif</th>
                    <td *matCellDef="let row" mat-cell>
                        <mat-icon *ngIf="row.active" class="text-green-500" svgIcon="mat:check_circle"></mat-icon>
                        <mat-icon *ngIf="!row.active" class="text-red-500" svgIcon="mat:cancel"></mat-icon>
                    </td>
                </ng-container>

                <!-- Actions Column -->
                <ng-container matColumnDef="actions">
                    <th *matHeaderCellDef mat-header-cell></th>
                    <td *matCellDef="let row" mat-cell>
                        <div class="flex">
                            <button
                                class="w-8 h-8 p-0 leading-none flex items-center justify-center hover:bg-hover text-primary-600 bg-primary-600/10"
                                matTooltip="Détails" (click)="goToShow(row.id)" mat-mini-fab>
                                <mat-icon svgIcon="mat:remove_red_eye"></mat-icon>
                            </button>
                            <button *ngIf="canEdit()"
                                class="w-8 h-8 p-0 leading-none flex items-center justify-center hover:bg-hover text-primary-600 bg-primary-600/10"
                                matTooltip="Modifier" (click)="goToEdit(row.id)" mat-mini-fab>
                                <mat-icon svgIcon="mat:edit"></mat-icon>
                            </button>
                            <button *ngIf="canDelete()"
                                class="w-8 h-8 p-0 leading-none flex items-center justify-center hover:bg-hover text-primary-600 bg-primary-600/10"
                                (click)="delete(row.id)" mat-mini-fab matTooltip="Supprimer" type="button">
                                <mat-icon svgIcon="mat:delete"></mat-icon>
                            </button>
                        </div>
                    </td>
                </ng-container>

                <tr *matHeaderRowDef="displayedColumns" mat-header-row></tr>
                <tr *matRowDef="let row; columns: displayedColumns" 
                    class="hover:bg-hover transition duration-400 ease-out-swift cursor-pointer" mat-row></tr>
            </table>

            <mat-paginator [pageSizeOptions]="[10, 25, 50]" [pageSize]="10"
                [length]="globalPayload.totalNumberOfElements" (page)="pageChange($event)"
                class="sticky left-0"></mat-paginator>
        </div>
    </vex-page-layout-content>
</vex-page-layout>
