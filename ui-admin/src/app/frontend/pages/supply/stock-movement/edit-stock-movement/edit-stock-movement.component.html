<div mat-dialog-title class="flex items-center justify-between">
  <div class="flex items-center gap-2">
    <mat-icon svgIcon="mat:inventory" class="text-amber-500"></mat-icon>
    <span>Modifier le Mouvement de Stock</span>
  </div>
  <button mat-icon-button type="button" (click)="close()">
    <mat-icon svgIcon="mat:close"></mat-icon>
  </button>
</div>

<mat-dialog-content>
  <form [formGroup]="generalForm" class="flex flex-col gap-4 pt-4">

    <vex-autocomplete-select appearance="outline" label="Produit" formControlName="productId" [required]="true"
      placeholder="Rechercher un produit..." [options]="productOptions"
      [error]="f['productId'].touched && f['productId'].hasError('required') ? 'Le produit est obligatoire' : null">
    </vex-autocomplete-select>

    <vex-autocomplete-select appearance="outline" label="Type de mouvement" formControlName="movementType" [required]="true"
      placeholder="Rechercher un type..." [options]="movementTypes"
      [error]="f['movementType'].touched && f['movementType'].hasError('required') ? 'Le type est obligatoire' : null">
    </vex-autocomplete-select>

    <mat-form-field appearance="outline">
      <mat-label>Quantité</mat-label>
      <input matInput type="number" formControlName="quantity" />
      <mat-error *ngIf="f['quantity'].hasError('required')">La quantité est obligatoire</mat-error>
      <mat-error *ngIf="f['quantity'].hasError('min')">La quantité doit être supérieure à 0</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Motif</mat-label>
      <input matInput formControlName="reason" />
      <mat-error *ngIf="f['reason'].hasError('maxlength')">Maximum 255 caractères</mat-error>
    </mat-form-field>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="close()">Annuler</button>
  <button mat-raised-button color="primary" type="button" (click)="edit()" [disabled]="generalForm.invalid">
    Enregistrer
  </button>
</mat-dialog-actions>
