<div mat-dialog-title class="flex items-center justify-between">
  <div class="flex items-center gap-2">
    <mat-icon svgIcon="mat:inventory" class="text-primary"></mat-icon>
    <span>Nouveau Mouvement de Stock</span>
  </div>
  <button mat-icon-button type="button" (click)="close()">
    <mat-icon svgIcon="mat:close"></mat-icon>
  </button>
</div>

<mat-dialog-content>
  <form [formGroup]="generalForm" class="flex flex-col gap-4 pt-4">

    <mat-form-field appearance="outline">
      <mat-label>Produit</mat-label>
      <mat-select formControlName="productId">
        <mat-option *ngFor="let p of products" [value]="p.id">
          {{ p.name }} ({{ p.code }})
        </mat-option>
      </mat-select>
      <mat-error *ngIf="f['productId'].hasError('required')">Le produit est obligatoire</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Type de mouvement</mat-label>
      <mat-select formControlName="movementType">
        <mat-option *ngFor="let t of movementTypes" [value]="t.value">{{ t.label }}</mat-option>
      </mat-select>
      <mat-error *ngIf="f['movementType'].hasError('required')">Le type est obligatoire</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Quantité</mat-label>
      <input matInput type="number" formControlName="quantity" placeholder="0.00" />
      <mat-error *ngIf="f['quantity'].hasError('required')">La quantité est obligatoire</mat-error>
      <mat-error *ngIf="f['quantity'].hasError('min')">La quantité doit être supérieure à 0</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Motif</mat-label>
      <input matInput formControlName="reason" placeholder="Motif du mouvement..." />
      <mat-error *ngIf="f['reason'].hasError('maxlength')">Maximum 255 caractères</mat-error>
    </mat-form-field>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="close()">Annuler</button>
  <button mat-raised-button color="primary" type="button" (click)="add()" [disabled]="generalForm.invalid">
    Enregistrer
  </button>
</mat-dialog-actions>
