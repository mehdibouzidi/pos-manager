<form [formGroup]="generalForm">
    <div class="flex items-center" mat-dialog-title>
        <h2 class="headline m-0 flex-auto">
            Modifier une Catégorie de Produit
        </h2>
        <button class="text-secondary" mat-dialog-close mat-icon-button type="button">
            <mat-icon svgIcon="mat:close"></mat-icon>
        </button>
    </div>

    <mat-divider class="text-border"></mat-divider>

    <mat-dialog-content class="flex flex-col">
        <div class="flex flex-col sm:flex-row sm:gap-4">
            <mat-form-field class="flex-auto">
                <mat-label>Code</mat-label>
                <input matInput required formControlName="code">
            </mat-form-field>
            <mat-form-field class="flex-auto">
                <mat-label>Nom</mat-label>
                <input matInput required formControlName="name">
            </mat-form-field>
        </div>

        <div class="flex flex-col gap-2 mt-2">
            <div class="upload-zone" (click)="photoInput.click()">
                <mat-icon svgIcon="mat:add_photo_alternate" class="upload-icon"></mat-icon>
                <span class="upload-label">Cliquer pour modifier la photo</span>
                <span class="upload-hint">PNG, JPG, WEBP</span>
            </div>
            <input #photoInput type="file" accept="image/*" (change)="onPhotoChange($event)" class="hidden">
            <img *ngIf="photoPreview" [src]="photoPreview" alt="Aper\u00e7u" class="mt-2 max-h-36 w-full rounded-lg object-contain border">
        </div>
    </mat-dialog-content>

    <mat-dialog-actions align="end">
        <button mat-button mat-dialog-close type="button">Annuler</button>
        <button color="primary" mat-flat-button type="button" [disabled]="!generalForm.valid" (click)="edit()">Valider</button>
    </mat-dialog-actions>
</form>
