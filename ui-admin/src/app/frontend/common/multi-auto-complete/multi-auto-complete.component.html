<mat-form-field class="w-full">
  <mat-label>{{ title }}</mat-label>
  <mat-select [formControl]="selectedItems" multiple>
    @for (item of allItems; track item) {
      <mat-option [value]="item">
        {{
          item.code && item.name
            ? item.code + ' - ' + item.name
            : item.code || item.name
        }}
      </mat-option>
    }
  </mat-select>
</mat-form-field>
