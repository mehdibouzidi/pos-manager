<div class="file-container" appDnd (fileDropped)="onFileDropped($event)">
  <input type="file" #fileDropRef id="fileDropRef" multiple (change)="fileBrowseHandler($event)"
    [disabled]="isDisabledOnFirstUpload" />
  <div class="flex flex-col items-center justify-center" >
    <img src="assets/img/dnd/ic-upload-file.svg" alt="" style="margin-bottom: 20px;">
  </div>

    <h3 class="mt-12">GLISSEZ, DEPOSEZ VOTRE FICHIER ICI</h3>
    <h3>OU</h3>
    <button color="primary" mat-stroked-button type="button" for="fileDropRef"
      [ngClass]="{'disable-lbl': isDisabledOnFirstUpload}" class="mt-4">
      PARCOURIR
    </button>
</div>
<div class="files-list">
  <div class="single-file" *ngFor="let file of files; let i = index">
    <img src="assets/img/dnd/ic-file.svg" width="45px" alt="file">
    <div class="info">
      <h4 class="name">
        {{ file?.name }}
      </h4>
      <p class="size">
        {{ formatBytes(file?.size) }}
      </p>
    </div>
    <img src="assets/img/dnd/ic-delete-file.svg" class="delete" width="20px" alt="file" (click)="deleteFile(i)">
  </div>
</div>
