<h1 mat-dialog-title>Confirmation</h1>
<div mat-dialog-content>Voulez-vous vraiment supprimer cet élément ?</div>
<div mat-dialog-actions>
  <button mat-button (click)="onCancel()">Annuler</button>
  <button mat-raised-button mat-button color="primary" (click)="onConfirm()">Confirmer</button>
</div>
